<footer class="site-footer">
  <div class="site-footer__inner">
    <p>© {{ site.time | date: "%Y" }} {{ site.author.name }}. 꾸준함이 실력이 됩니다.</p>
    <p class="site-footer__links">
      {% if site.author.github and site.author.github != "" %}<a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
      {% if site.author.email and site.author.email != "" %}<a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </div>
</footer>
