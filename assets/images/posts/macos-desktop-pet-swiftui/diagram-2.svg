<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15">
  <rect x="0" y="0" width="720" height="400" fill="#f3faf8"/>
  <line x1="360" y1="30" x2="360" y2="370" stroke="#8b929a" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- 왼쪽: 기본 -->
  <text x="185" y="44" text-anchor="middle" fill="#1f2328" font-weight="700">기본: 왼쪽 위 고정</text>
  <rect x="60" y="70" width="250" height="260" rx="14" fill="none" stroke="#8b929a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="185" y="300" text-anchor="middle" fill="#8b929a" font-size="14">펼쳤을 때 창</text>
  <rect x="60" y="70" width="250" height="110" rx="14" fill="#ffffff" stroke="#14a085" stroke-width="2.5"/>
  <text x="140" y="130" text-anchor="middle" fill="#1f2328" font-size="14">접은 뒤 창</text>
  <circle cx="270" cy="148" r="20" fill="#c08a6a" stroke="#1f2328" stroke-width="2"/>
  <circle cx="60" cy="70" r="8" fill="#f2a93b"/>
  <text x="185" y="362" text-anchor="middle" fill="#1f2328">펫이 위로 딸려 올라감 ✗</text>

  <!-- 오른쪽: 수정 -->
  <text x="535" y="44" text-anchor="middle" fill="#1f2328" font-weight="700">수정: 오른쪽 아래 고정</text>
  <rect x="410" y="70" width="250" height="260" rx="14" fill="none" stroke="#8b929a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="535" y="100" text-anchor="middle" fill="#8b929a" font-size="14">펼쳤을 때 창</text>
  <rect x="410" y="220" width="250" height="110" rx="14" fill="#ffffff" stroke="#14a085" stroke-width="2.5"/>
  <text x="490" y="280" text-anchor="middle" fill="#1f2328" font-size="14">접은 뒤 창</text>
  <circle cx="620" cy="298" r="20" fill="#c08a6a" stroke="#1f2328" stroke-width="2"/>
  <circle cx="660" cy="330" r="8" fill="#f2a93b"/>
  <text x="535" y="362" text-anchor="middle" fill="#1f2328">펫은 제자리에 ✓</text>
</svg>
