<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b929a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f2a93b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="400" fill="#f3faf8"/>

  <!-- 외부 -->
  <rect x="20" y="70" width="150" height="56" rx="10" fill="#ffffff" stroke="#8b929a" stroke-width="2"/>
  <text x="95" y="103" text-anchor="middle" fill="#1f2328">Google 캘린더</text>
  <rect x="20" y="250" width="150" height="56" rx="10" fill="#ffffff" stroke="#8b929a" stroke-width="2"/>
  <text x="95" y="283" text-anchor="middle" fill="#1f2328">iPhone 미리알림</text>

  <!-- 맥 기본 앱 -->
  <rect x="200" y="70" width="140" height="56" rx="10" fill="#ffffff" stroke="#14a085" stroke-width="2"/>
  <text x="270" y="103" text-anchor="middle" fill="#1f2328">맥 캘린더</text>
  <rect x="200" y="250" width="140" height="56" rx="10" fill="#ffffff" stroke="#14a085" stroke-width="2"/>
  <text x="270" y="283" text-anchor="middle" fill="#1f2328">맥 미리알림</text>

  <text x="185" y="56" text-anchor="middle" fill="#8b929a" font-size="14">인터넷 계정 동기화</text>
  <text x="185" y="336" text-anchor="middle" fill="#8b929a" font-size="14">iCloud 동기화</text>

  <line x1="170" y1="98" x2="198" y2="98" stroke="#8b929a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="172" y1="278" x2="198" y2="278" stroke="#8b929a" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- EventKit -->
  <rect x="370" y="150" width="120" height="80" rx="12" fill="#2f5bd3"/>
  <text x="430" y="196" text-anchor="middle" fill="#ffffff" font-weight="700">EventKit</text>

  <line x1="340" y1="98" x2="380" y2="148" stroke="#8b929a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="342" y1="278" x2="380" y2="232" stroke="#8b929a" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- 앱 내부 -->
  <rect x="530" y="40" width="170" height="56" rx="10" fill="#14a085"/>
  <text x="615" y="73" text-anchor="middle" fill="#ffffff" font-weight="700">TodoStore</text>
  <rect x="530" y="150" width="170" height="56" rx="10" fill="#ffffff" stroke="#14a085" stroke-width="2"/>
  <text x="615" y="183" text-anchor="middle" fill="#1f2328">말풍선 (SwiftUI)</text>
  <rect x="530" y="260" width="170" height="56" rx="10" fill="#ffffff" stroke="#14a085" stroke-width="2"/>
  <text x="615" y="293" text-anchor="middle" fill="#1f2328">몽글이 NSPanel</text>

  <line x1="490" y1="175" x2="528" y2="80" stroke="#8b929a" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="615" y1="96" x2="615" y2="148" stroke="#8b929a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="615" y1="206" x2="615" y2="258" stroke="#8b929a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Claude -->
  <rect x="330" y="326" width="150" height="50" rx="10" fill="#ffffff" stroke="#f2a93b" stroke-width="2.5"/>
  <text x="405" y="356" text-anchor="middle" fill="#1f2328">Claude 앱</text>
  <line x1="530" y1="300" x2="482" y2="346" stroke="#f2a93b" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="502" y="310" text-anchor="end" fill="#f2a93b" font-size="14" font-weight="700">클릭</text>
