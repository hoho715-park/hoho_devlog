<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b929a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="400" fill="#f3faf8"/>

  <!-- 1행 -->
  <rect x="20" y="60" width="175" height="56" rx="10" fill="#1f2328"/>
  <text x="107" y="93" text-anchor="middle" fill="#ffffff">Claude Code 작업 끝</text>

  <rect x="225" y="60" width="120" height="56" rx="10" fill="#2f5bd3"/>
  <text x="285" y="93" text-anchor="middle" fill="#ffffff" font-weight="700">Stop 훅</text>

  <rect x="375" y="60" width="140" height="56" rx="10" fill="#ffffff" stroke="#14a085" stroke-width="2"/>
  <text x="445" y="93" text-anchor="middle" fill="#1f2328">notify.sh</text>
  <text x="445" y="140" text-anchor="middle" fill="#8b929a" font-size="14">한 줄 기록</text>

  <rect x="545" y="60" width="155" height="56" rx="10" fill="#ffffff" stroke="#14a085" stroke-width="2"/>
  <text x="622" y="93" text-anchor="middle" fill="#1f2328">events.jsonl</text>

  <line x1="195" y1="88" x2="223" y2="88" stroke="#8b929a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="345" y1="88" x2="373" y2="88" stroke="#8b929a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="515" y1="88" x2="543" y2="88" stroke="#8b929a" stroke-width="2" marker-end="url(#a)"/>

  <!-- 아래로 -->
  <line x1="622" y1="116" x2="622" y2="234" stroke="#8b929a" stroke-width="2" marker-end="url(#a)"/>
  <text x="632" y="180" text-anchor="start" fill="#8b929a" font-size="14">새 줄 감지</text>

  <!-- 2행 (오른쪽 → 왼쪽) -->
  <rect x="545" y="236" width="155" height="64" rx="10" fill="#14a085"/>
  <text x="622" y="262" text-anchor="middle" fill="#ffffff" font-weight="700">몽글이</text>
  <text x="622" y="284" text-anchor="middle" fill="#ffffff" font-size="14">1초마다 확인</text>

  <rect x="335" y="240" width="175" height="56" rx="10" fill="#ffffff" stroke="#f2a93b" stroke-width="2.5"/>
  <text x="422" y="273" text-anchor="middle" fill="#1f2328">알림 카드 + 소리</text>

  <rect x="105" y="240" width="195" height="56" rx="10" fill="#ffffff" stroke="#2f5bd3" stroke-width="2"/>
  <text x="202" y="273" text-anchor="middle" fill="#1f2328">열기 → VS Code</text>

  <line x1="545" y1="268" x2="512" y2="268" stroke="#8b929a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="335" y1="268" x2="302" y2="268" stroke="#8b929a" stroke-width="2" marker-end="url(#a)"/>

  <text x="360" y="360" text-anchor="middle" fill="#8b929a" font-size="14">Notification 훅(확인 필요)도 같은 길로 → 주황 카드</text>
</svg>
